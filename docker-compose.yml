name: career-simulation-platform

services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-career_simulation}
      POSTGRES_USER: ${POSTGRES_USER:-career_sim}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-career_sim_dev}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - career_simulation_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-career_sim} -d ${POSTGRES_DB:-career_simulation}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-career_simulation}
      DB_USERNAME: ${APP_DB_USERNAME:-${POSTGRES_USER:-career_sim}}
      DB_PASSWORD: ${APP_DB_PASSWORD:-${POSTGRES_PASSWORD:-career_sim_dev}}
      FLYWAY_DB_USERNAME: ${FLYWAY_DB_USERNAME:-${POSTGRES_USER:-career_sim}}
      FLYWAY_DB_PASSWORD: ${FLYWAY_DB_PASSWORD:-${POSTGRES_PASSWORD:-career_sim_dev}}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000,http://localhost:8080}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      CORE_V2_ENABLED: ${CORE_V2_ENABLED:-true}
      LEGACY_WRITE_ENABLED: ${LEGACY_WRITE_ENABLED:-false}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-}
      JWT_ALLOW_EPHEMERAL_KEY: ${JWT_ALLOW_EPHEMERAL_KEY:-false}
      JWT_LIFETIME_SECONDS: ${JWT_LIFETIME_SECONDS:-900}
      AGENT_PLATFORM_ENABLED: ${AGENT_PLATFORM_ENABLED:-true}
      GOOGLE_OAUTH_ENABLED: ${GOOGLE_OAUTH_ENABLED:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      PRIVATE_STORAGE_ROOT: /app/private-assets
      AI_PROVIDER: ${AI_PROVIDER:-disabled}
      SYN_WEB_ENABLED: ${SYN_WEB_ENABLED:-false}
      SYN_WEB_MODEL: ${SYN_WEB_MODEL:-${GEMINI_MODEL:-gemini-3.1-flash-lite}}
      SYN_COST_RATES_JSON: ${SYN_COST_RATES_JSON:-[]}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-5.6-luna}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      KNOWLEDGE_EMBEDDING_ENABLED: ${KNOWLEDGE_EMBEDDING_ENABLED:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      AI_GEMINI_TOOL_PLANNING_ENABLED: ${AI_GEMINI_TOOL_PLANNING_ENABLED:-false}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-8}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-300}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8081}:8080"
    volumes:
      - career_simulation_private_assets:/app/private-assets
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_CORE_V2_ENABLED: ${VITE_CORE_V2_ENABLED:-true}
        VITE_AGENT_PLATFORM_ENABLED: ${VITE_AGENT_PLATFORM_ENABLED:-true}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend

  gateway:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:80"
    volumes:
      - ./deployment/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  career_simulation_private_assets:
  career_simulation_postgres_data:
