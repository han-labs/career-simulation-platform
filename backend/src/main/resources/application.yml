server:
  port: ${SERVER_PORT:8080}
  max-http-request-header-size: 16KB
  servlet:
    context-path: /api
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax
  error:
    include-message: never

spring:
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  application:
    name: career-simulation-platform
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:career_simulation}
    username: ${DB_USERNAME:career_sim}
    password: ${DB_PASSWORD:career_sim_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
  flyway:
    enabled: true
    user: ${FLYWAY_DB_USERNAME:${spring.datasource.username}}
    password: ${FLYWAY_DB_PASSWORD:${spring.datasource.password}}
    locations: classpath:db/migration
    validate-on-migrate: true

app:
  auth:
    jwt:
      signing-key: ${JWT_SIGNING_KEY:}
      allow-ephemeral-key: ${JWT_ALLOW_EPHEMERAL_KEY:false}
      lifetime-seconds: ${JWT_LIFETIME_SECONDS:900}
    google:
      enabled: ${GOOGLE_OAUTH_ENABLED:false}
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_REDIRECT_URI:}
  core-v2-enabled: ${CORE_V2_ENABLED:false}
  legacy-write-enabled: ${LEGACY_WRITE_ENABLED:false}
  storage:
    root: ${PRIVATE_STORAGE_ROOT:./private-assets}
  syn:
    cleanup-enabled: ${SYN_CLEANUP_ENABLED:false}
    web-enabled: ${SYN_WEB_ENABLED:false}
    web-model: ${SYN_WEB_MODEL:${GEMINI_MODEL:gemini-3.1-flash-lite}}
    cost-rates-json: ${SYN_COST_RATES_JSON:[]}
  knowledge:
    embedding-enabled: ${KNOWLEDGE_EMBEDDING_ENABLED:false}
    minimum-similarity: ${KNOWLEDGE_MINIMUM_SIMILARITY:0.5}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:8080}
  security:
    local-demo-mode: ${LOCAL_DEMO_MODE:false}
    local-demo-email: ${LOCAL_DEMO_EMAIL:student@demo.com}
  ai:
    provider: ${AI_PROVIDER:disabled}
    api-key: ${OPENAI_API_KEY:}
    model: ${AI_MODEL:gpt-5.6-luna}
    base-url: ${AI_BASE_URL:https://api.openai.com/v1}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-3.1-flash-lite}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
      tool-planning-enabled: ${AI_GEMINI_TOOL_PLANNING_ENABLED:false}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:8}
    max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:450}

logging:
  level:
    root: INFO
    edu.hcmute.careersim: INFO
